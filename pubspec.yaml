name: speeDGA
description: "App de telemetría de alta precisión con velocímetro y odómetro."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Iconos estándar
  cupertino_icons: ^1.0.8

  # Conexión con la base de datos en la nube
  supabase_flutter: ^2.8.1

  # Acceso al GPS del móvil
  geolocator: ^13.0.1

  # Evita que la pantalla se apague mientras conduces
  wakelock_plus: ^1.2.8
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  
  # Gestión de permisos en tiempo de ejecución
  permission_handler: ^11.3.1
  http: ^1.2.0
  
  # Zona horaria para mostrar hora de Barcelona
  timezone: ^0.9.4
  flutter_native_timezone: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Si en el futuro añades imágenes o fuentes personalizadas, irán aquí debajo.