name: Build speeDGA Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar y Publicar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Asegurar permisos de ejecución en Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Configurar android/local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      - name: Compilar APK de Release para Android
        run: |
          set +e
          flutter build apk --release > build_output.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error title=Flutter Build Error::$(tail -n 15 build_output.log | tr '\n' ' ')"
            while IFS= read -r line; do
              echo "::notice::$line"
            done < <(tail -n 35 build_output.log)
            exit $STATUS
          fi

      - name: Preparar archivo APK
        run: |
          mkdir -p release_output
          cp build/app/outputs/flutter-apk/app-release.apk release_output/speeDGA.apk

      - name: Subir APK como artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: speeDGA-release-apk
          path: release_output/speeDGA.apk
          retention-days: 30

      - name: Publicar Release en GitHub para descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "speeDGA - Ciclocomputador (Última versión)"
          body: |
            ## 🚴 speeDGA - Ciclocomputador GPS
            Nueva versión compilada automáticamente desde la rama `main`.
            
            ### ✨ Novedades incluidas:
            * **Base de datos 100% Local (SQLite):** Nunca se desactiva ni depende de servidores externos.
            * **Exportación GPX:** Compatible con Strava, Wikiloc y Garmin Connect.
            * **Telemetría para Bicicleta:** Desnivel acumulado (+D), pausa automática, velocidad media y datos de viento.
            * **Interfaz adaptable:** Soporte para orientación vertical y horizontal (apaisado) en manillar.
            
            ### 📲 Instalación:
            Descarga el archivo adjunto `speeDGA.apk` directamente en tu móvil e instálalo.
          files: release_output/speeDGA.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
